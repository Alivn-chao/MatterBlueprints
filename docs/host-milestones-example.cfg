# Copy the hostMilestones category into config/matterblueprints.cfg, then restart the server/game.
# 时间 tick: 20 tick = 1 秒。六级门槛必须为正整数并严格递增。
hostMilestones {
    S:runtimeTicks <
        12000
        72000
        432000
        1728000
        5184000
        12096000
     >
    S:workUnits <
        1000
        10000
        100000
        500000
        2000000
        10000000
     >
    S:energyEU <
        100000000000
        10000000000000
        1000000000000000
        100000000000000000
        10000000000000000000
        1000000000000000000000
     >
    I:bonusLevels <
        1
        3
        6
     >
    I:durationPercent <
        75
        50
        25
     >
    I:powerPercent <
        75
        50
        25
     >
    # 0 = 托管机器数
    I:parallelMultiplier <
        2
        4
        0
     >
    I:taskLimit <
        4
        16
        0
     >
    # 每点额外增加 25% 产量
    I:yieldQuarterBonus <
        1
        2
        4
     >
    I:voltageLevel=5
    # 累计有效运行多少小时后永久解锁煅炉 50% 催化剂减免（独立于六级里程碑）
    I:plasmaFuelHours=8
    # 进阶装配线：0=配方物品输入项数；16=固定16基础并行
    I:advancedAssemblyFixedParallel=0
    # 能量 III 级普通超频，VI 级无损超频；此前激光超频
    I:advancedAssemblyNormalLevel=3
    I:advancedAssemblyPerfectLevel=6
}
